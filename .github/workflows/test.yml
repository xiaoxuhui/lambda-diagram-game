name: Web tests
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build
      - run: npm run sync:android
      - run: npm run check:android
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run sync:android
      - run: npm run test:browser
      - run: node tests/speed-browser.cjs && node tests/viewport-browser.cjs && node tests/edit-browser.cjs && npm run test:android-bridge
      - run: node tests/clear-browser.cjs
      - run: node tests/reduction-browser.cjs
      - run: node tests/performance-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: tests/artifacts/
          if-no-files-found: ignore
