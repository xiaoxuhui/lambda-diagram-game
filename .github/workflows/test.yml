name: Web tests
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build
      - run: npm run sync:android
      - run: npm run check:android
      - run: npm test
  browser:
    # ubuntu-latest 已切到 26.04，Playwright 1.56.1 没有对应 chromium 构建，
    # 固定在 22.04 上跑浏览器回归，等升级 Playwright 再放开。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run sync:android
      - run: npm run test:browser
      - run: node tests/speed-browser.cjs && node tests/viewport-browser.cjs && node tests/edit-browser.cjs && npm run test:android-bridge
      - run: node tests/clear-browser.cjs
      - run: node tests/reduction-browser.cjs
      - run: node tests/performance-browser.cjs
      - run: node tests/manual-reduction-browser.cjs
      - run: node tests/reduction-order-browser.cjs
      - run: node tests/combinator-compiler-browser.cjs
      - run: node tests/function-reduction-browser.cjs
      - run: node tests/unfold-animation-browser.cjs
      - run: node tests/guide-library-browser.cjs
      - run: node tests/inverse-guide-browser.cjs && node tests/combinator-roundtrip-browser.cjs
      - run: node tests/click-unfold-browser.cjs
      - run: node tests/sequences-browser.cjs
      - run: node tests/data-unfold-browser.cjs
      - run: node tests/static-link-browser.cjs
      - run: node tests/boolean-circuits-browser.cjs
      - run: node tests/power-zero-browser.cjs
      - run: node tests/compiler-standard-browser.cjs
      - run: node tests/encoding-deferred-browser.cjs
      - run: node tests/interpret-call-browser.cjs
      - run: node tests/all-entry-contracts-browser.cjs
      - run: node tests/list-operations-browser.cjs
      - run: node tests/function-collision-browser.cjs
      - run: node tests/extended-combinators-browser.cjs
      - run: node tests/definitions-browser.cjs
      - run: node tests/exact-example-import-browser.cjs
      - run: node tests/conversion-preserves-source-browser.cjs
      - run: node tests/example-library-browser.cjs
      - run: node tests/example-fast-run-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-evidence
          path: tests/artifacts/
          if-no-files-found: ignore
